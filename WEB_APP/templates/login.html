{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gray-900">
    <div class="bg-gray-800 text-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-blue-400 mb-6">🔐 Login</h2>
        
        <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
            <!-- Username -->
            <div>
                <label for="username" class="block text-gray-300 font-semibold">Username</label>
                <div class="flex items-center border border-gray-600 rounded-lg bg-gray-700 p-2 focus-within:ring-2 focus-within:ring-blue-500">
                    <i class="bi bi-person-fill text-gray-400 mr-2"></i>
                    <input type="text" id="username" name="username" required
                        class="w-full bg-transparent text-white focus:outline-none placeholder-gray-400"
                        placeholder="Enter your username">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-gray-300 font-semibold">Password</label>
                <div class="flex items-center border border-gray-600 rounded-lg bg-gray-700 p-2 focus-within:ring-2 focus-within:ring-blue-500">
                    <i class="bi bi-lock-fill text-gray-400 mr-2"></i>
                    <input type="password" id="password" name="password" required
                        class="w-full bg-transparent text-white focus:outline-none placeholder-gray-400"
                        placeholder="Enter your password">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg flex items-center justify-center gap-2 transition">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
        </form>

        <!-- Register Link -->
        <p class="text-center text-gray-400 mt-4">
            Don't have an account? 
            <a href="{{ url_for('register') }}" class="text-blue-400 hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
